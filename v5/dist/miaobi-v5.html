.mb-markdown li{padding-left:4px;margin:6px 0;display:list-item}
.mb-markdown li::marker{color:var(--mb-sub)}
.mb-markdown blockquote{margin:16px 0;padding:5px 0 5px 15px;border-left:2px solid var(--mb-faint);color:var(--mb-muted);font-size:12px;white-space:pre-wrap}
.mb-markdown hr{border:0;border-top:1px solid var(--mb-line);margin:22px 0}
.mb-markdown code{font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--mb-raised);padding:2px 5px;border-radius:4px}
.mb-markdown a{color:var(--mb-accent);text-decoration:underline;text-underline-offset:3px}
.mb-code{margin:15px 0 20px;background:var(--mb-side);border:1px solid var(--mb-line);border-radius:12px;overflow:hidden}
.mb-code>div{display:flex;align-items:center;justify-content:space-between;background:var(--mb-raised);padding:8px 13px;color:var(--mb-muted);font-size:10px}
.mb-code button{font-size:10px;gap:5px}
.mb-code pre{margin:0;padding:15px;overflow-x:auto}
.mb-code pre>code{background:none;padding:0;white-space:pre;display:block}
.mb-table-scroll{overflow-x:auto;margin:16px 0;border:1px solid var(--mb-line);border-radius:8px}
.mb-markdown table{border-collapse:collapse;width:100%;font-size:12px}
.mb-markdown th,.mb-markdown td{padding:9px 12px;border-bottom:1px solid var(--mb-line);text-align:left}
.mb-markdown th{background:var(--mb-raised)}
.mb-message-actions{display:flex;align-items:center;gap:4px;margin:10px -6px 0;color:var(--mb-muted);flex-wrap:wrap}
.mb-message-actions .mb-icon-btn{width:30px;min-width:30px;height:30px}
.mb-variants{display:flex;align-items:center;gap:0;border-left:1px solid var(--mb-line);margin-left:5px;padding-left:6px;font-size:10px;color:var(--mb-muted)}
.mb-variants>span{min-width:32px;text-align:center}
.mb-variants .mb-icon-btn{width:23px;min-width:23px}
.mb-app .mb-edit-document{margin-left:5px;font-size:10px;gap:5px;padding:6px 9px;color:var(--mb-muted)}
.mb-edit-document:hover{background:var(--mb-raised);color:var(--mb-text)}
.mb-followups{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.mb-app .mb-followups>button{min-height:32px;border:1px solid var(--mb-line);border-radius:17px;padding:0 12px;font-size:10px;color:var(--mb-sub);gap:15px}
.mb-followups>button:hover{background:var(--mb-raised)}
.mb-generating{display:flex;align-items:center;flex-wrap:wrap;gap:12px;min-height:55px;color:var(--mb-sub);font-size:12px}
.mb-generating>small{font-size:10px;color:var(--mb-faint)}
.mb-thinking-dots{display:flex;gap:4px}
.mb-thinking-dots>i{width:5px;height:5px;background:var(--mb-accent);border-radius:50%;animation:mb-pulse 1.25s infinite}
.mb-thinking-dots>i:nth-child(2){animation-delay:.14s}
.mb-thinking-dots>i:nth-child(3){animation-delay:.28s}
.mb-inline-notice{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--mb-muted);font-size:11px;padding:10px 0}
.mb-inline-notice>button{color:var(--mb-accent);text-decoration:underline;font-size:11px}
.mb-response-error{display:flex;align-items:flex-start;gap:11px;padding:16px;background:#d8847208;border:1px solid #b7786333;border-radius:12px;color:var(--mb-danger)}
.mb-response-error b{font-size:12px;font-weight:500}
.mb-response-error p{font-size:11px;line-height:1.85;margin:8px 0 14px;color:var(--mb-sub)}
.mb-bottom-composer{flex-shrink:0;width:min(800px,calc(100% - 80px));margin:0 auto;padding:12px 0 19px;position:relative;background:var(--mb-bg)}
.mb-bottom-composer:before{content:'';position:absolute;top:-27px;left:0;right:0;height:28px;background:linear-gradient(transparent,var(--mb-bg));pointer-events:none}
.mb-bottom-composer .mb-composer{padding-top:15px;border-radius:23px}
.mb-bottom-composer .mb-composer-toolbar{margin-top:8px}
.mb-app .mb-scroll-bottom{position:absolute;top:-45px;left:50%;transform:translateX(-50%);width:32px;height:32px;padding:0;background:var(--mb-panel);border:1px solid var(--mb-line);border-radius:50%;z-index:3;box-shadow:0 3px 12px #0002}
.mb-user-edit{min-width:min(540px,100%);padding:15px;border:1px solid var(--mb-line);background:var(--mb-raised);border-radius:16px}
.mb-user-edit>textarea{width:100%;min-height:120px;padding:6px;background:none;border:0;line-height:1.8;font-size:13px}
.mb-user-edit>p{font-size:10px;color:var(--mb-muted);margin:12px 0}
.mb-user-edit>div{display:flex;justify-content:flex-end;gap:12px}
.mb-user-edit>div>button{font-size:11px;padding:7px 12px}
/* Reusable controls and dialogs */
.mb-app .mb-primary-btn,.mb-app .mb-secondary-btn,.mb-app .mb-danger-solid{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:8px 16px;border-radius:9px;font-size:12px;font-weight:500;gap:7px}
.mb-app .mb-primary-btn{background:var(--mb-solid);color:var(--mb-on-solid)}
.mb-app .mb-secondary-btn{border:1px solid var(--mb-line);background:var(--mb-raised);color:var(--mb-sub)}
.mb-app .mb-primary-btn:hover:not(:disabled){filter:brightness(.92)}
.mb-app .mb-secondary-btn:hover:not(:disabled){background:var(--mb-hover);color:var(--mb-text)}
.mb-app .mb-danger-solid{background:#b94c43;color:white}
.mb-app .mb-text-btn{font-size:12px;color:var(--mb-muted);padding:8px}
.mb-app .mb-danger-btn{display:flex;align-items:center;gap:8px;border:1px solid #b970693d;color:var(--mb-danger);font-size:11px;min-height:36px;padding:8px 12px}
.mb-overlay{position:fixed;inset:0;z-index:90;background:#0008;backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:28px;animation:mb-fade .16s ease}
.mb-dialog{width:600px;max-width:100%;max-height:calc(100dvh - 56px);display:flex;flex-direction:column;background:var(--mb-panel);border:1px solid #8884;border-radius:20px;box-shadow:var(--mb-shadow);overflow:hidden;animation:mb-rise .18s ease;outline:0}
.mb-dialog-head{display:flex;justify-content:space-between;align-items:flex-start;padding:25px 25px 21px;gap:15px;border-bottom:1px solid var(--mb-line);flex-shrink:0}
.mb-dialog-head h2{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:.02em}
.mb-dialog-head p{margin-top:7px;font-size:11px;color:var(--mb-muted);line-height:1.8;max-width:460px}
.mb-dialog-head>.mb-icon-btn{margin-top:-3px;margin-right:-6px}
.mb-dialog-body{padding:22px 25px 25px;overflow:auto;min-height:0}
.mb-dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:24px}
.mb-dialog-actions .mb-text-btn{margin-right:auto}
.mb-catalog-overlay .mb-dialog{width:880px}
.mb-search-field{display:flex;align-items:center;gap:10px;min-height:45px;padding:0 12px;background:var(--mb-bg);border:1px solid var(--mb-line);border-radius:10px;color:var(--mb-muted)}
.mb-search-field:focus-within{border-color:var(--mb-faint)}
.mb-search-field>input{flex:1;min-width:0;border:0;background:none;height:44px;box-shadow:none!important;font-size:12px;color:var(--mb-text)}
.mb-search-field>button{padding:4px}
.mb-filter-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0}
.mb-app .mb-filter-tabs>button{font-size:11px;padding:6px 11px;min-height:32px;color:var(--mb-muted);border:1px solid transparent}
.mb-filter-tabs>button.active{background:var(--mb-raised);border-color:var(--mb-line);color:var(--mb-text)}
.mb-filter-tabs>button:hover{background:var(--mb-hover)}
.mb-catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}
.mb-app .mb-catalog-card{display:flex;align-items:center;justify-content:flex-start;gap:12px;min-height:79px;padding:13px;border:1px solid var(--mb-line);border-radius:11px;color:var(--mb-text)}
.mb-catalog-card:hover{background:var(--mb-hover);border-color:var(--mb-muted)}
.mb-catalog-card.selected{border-color:#d3a08077;background:var(--mb-accent-bg)}
.mb-catalog-card>span:nth-child(2){min-width:0;flex:1}
.mb-catalog-card b{font-size:12px;font-weight:500;display:block}
.mb-catalog-card small{font-size:10px;color:var(--mb-muted);display:block;margin-top:4px;line-height:1.7}
.mb-catalog-card>svg:last-child{color:var(--mb-accent)}
.mb-catalog-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--mb-accent);background:var(--mb-accent-bg);flex-shrink:0}
.mb-empty-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:55px 15px;text-align:center;color:var(--mb-muted)}
.mb-empty-panel>svg{color:var(--mb-faint);margin-bottom:17px}
.mb-empty-panel>h3{font-size:16px;font-weight:500;color:var(--mb-sub)}
.mb-empty-panel>p{font-size:11px;margin-top:10px;line-height:1.8}
.mb-empty-panel>button{margin-top:20px;font-size:11px;color:var(--mb-accent);gap:10px}
.mb-field-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin:0 0 12px;color:var(--mb-sub)}
.mb-field-label small{font-size:10px;color:var(--mb-muted)}
.mb-style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:22px}
.mb-app .mb-style-grid>button{flex-direction:column;align-items:stretch;padding:11px 13px;border:1px solid var(--mb-line);border-radius:9px;gap:5px}
.mb-style-grid>button>span{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.mb-style-grid>button>span>svg{color:var(--mb-accent)}
.mb-style-grid>button>small{font-size:9px;line-height:1.7;color:var(--mb-muted)}
.mb-style-grid>button.selected{border-color:#d3a08088;background:var(--mb-accent-bg)}
.mb-style-grid>button:hover{background:var(--mb-hover)}
.mb-form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:19px}
.mb-form-row label,.mb-block-label{display:block;font-size:11px;color:var(--mb-sub)}
.mb-form-row input,.mb-form-row select,.mb-block-label input,.mb-block-label select,.mb-block-label textarea{display:block;width:100%;background:var(--mb-bg);border:1px solid var(--mb-line);border-radius:8px;padding:10px;margin:8px 0 0;font-size:11px;color:var(--mb-text);min-height:39px}
.mb-block-label{margin-top:18px;margin-bottom:18px}
.mb-block-label textarea{min-height:87px;line-height:1.8}
.mb-app .mb-segment{display:inline-flex;align-items:center;border:1px solid var(--mb-line);padding:3px;background:var(--mb-bg);border-radius:9px;gap:2px}
.mb-app .mb-segment>button{display:inline-flex;min-height:29px;justify-content:center;padding:4px 11px;font-size:10px;gap:5px;color:var(--mb-muted);border-radius:6px}
.mb-segment>button.active{background:var(--mb-hover);color:var(--mb-text);box-shadow:0 1px 3px #0001}
.mb-segment>button:hover{color:var(--mb-text)}
.mb-full-segment{display:flex!important;width:100%;margin-bottom:20px}
.mb-full-segment>button{flex:1}
.mb-search-results{margin:15px -5px 0}
.mb-app .mb-search-results>button{display:flex;align-items:center;width:100%;justify-content:flex-start;padding:13px 8px;gap:12px;border-radius:9px}
.mb-search-results>button:hover{background:var(--mb-hover)}
.mb-search-results>button>svg{color:var(--mb-muted)}
.mb-search-results>button>span{flex:1;min-width:0}
.mb-search-results b{font-size:12px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-search-results small{display:block;font-size:10px;color:var(--mb-muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-search-results time{font-size:9px;white-space:nowrap;color:var(--mb-faint)}
.mb-favorites-list{display:grid;gap:12px}
.mb-favorites-list>article{border:1px solid var(--mb-line);padding:12px 15px 15px;border-radius:12px}
.mb-favorites-list>article>div{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--mb-muted)}
.mb-favorites-list>article>p{font-size:12px;color:var(--mb-sub);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}
.mb-favorites-list footer{display:flex;justify-content:space-between;margin-top:16px;font-size:9px;color:var(--mb-faint)}
.mb-favorites-list footer>button{font-size:10px;color:var(--mb-accent);gap:7px}
.mb-engine-card{display:flex;align-items:center;gap:13px;padding:18px 14px;border:1px solid var(--mb-line);border-radius:12px;margin-bottom:12px}
.mb-engine-card>span{color:var(--mb-accent)}
.mb-engine-card>div{flex:1}
.mb-engine-card b{font-size:13px;font-weight:500}
.mb-engine-card p{font-size:11px;color:var(--mb-sub);margin:6px 0 4px;line-height:1.8}
.mb-engine-card small{font-size:9px;color:var(--mb-muted)}
.mb-engine-card.selected{border-color:#d3a08088;background:var(--mb-accent-bg)}
.mb-engine-card>svg{color:var(--mb-accent)}
.mb-info-note{display:flex;align-items:flex-start;gap:10px;padding:13px 0 0;color:var(--mb-muted)}
.mb-info-note>svg{margin-top:2px}
.mb-info-note>p{font-size:11px;line-height:1.9}
.mb-setting-line{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px 0;border-bottom:1px solid var(--mb-line)}
.mb-setting-line:first-child{padding-top:0}
.mb-setting-line>div:first-child{flex:1;min-width:0}
.mb-setting-line b{font-size:12px;font-weight:500;display:block}
.mb-setting-line small{font-size:10px;color:var(--mb-muted);display:block;margin-top:6px;line-height:1.7}
.mb-setting-line a{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mb-accent);white-space:nowrap}
.mb-app .mb-toggle{width:36px;height:21px;padding:3px;border-radius:20px;background:var(--mb-faint);justify-content:flex-start}
.mb-toggle>i{width:15px;height:15px;display:block;border-radius:50%;background:var(--mb-bg);transition:transform .15s}
.mb-app .mb-toggle.on{background:var(--mb-accent)}
.mb-toggle.on>i{transform:translateX(15px)}
.mb-settings-links{display:flex;flex-wrap:wrap;gap:17px;margin:23px 0}
.mb-settings-links>a{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mb-muted)}
.mb-settings-links>a:hover{color:var(--mb-text)}
.mb-help-steps{display:grid;gap:23px}
.mb-help-steps>article{display:flex;align-items:flex-start;gap:15px}
.mb-help-steps>article>span{font-size:12px;color:var(--mb-accent);font-family:ui-monospace,monospace;margin-top:3px}
.mb-help-steps b{font-size:13px;font-weight:500}
.mb-help-steps p{margin-top:7px;font-size:11px;color:var(--mb-muted);line-height:1.9}
.mb-shortcuts{margin:22px 0 8px;padding:15px 0;border-block:1px solid var(--mb-line);display:grid;gap:11px}
.mb-shortcuts>span{display:flex;justify-content:space-between;color:var(--mb-sub);font-size:11px}
.mb-shortcuts kbd{border:1px solid var(--mb-line);border-radius:4px;padding:2px 5px;color:var(--mb-muted);font-size:9px}
.mb-confirm-overlay .mb-dialog{width:430px}
.mb-confirm-copy{font-size:12px;line-height:1.9;color:var(--mb-sub)}
/* Document panel */
.mb-editor{width:390px;flex-shrink:0;background:var(--mb-side);border-left:1px solid var(--mb-line);display:flex;flex-direction:column;z-index:15;animation:mb-slide .2s ease-out;min-height:0}
.mb-editor>header{display:flex;align-items:center;justify-content:space-between;padding:19px 19px 16px;border-bottom:1px solid var(--mb-line)}
.mb-editor>header>div{display:flex;align-items:center;gap:11px;color:var(--mb-accent)}
.mb-editor>header strong{font-size:13px;display:block;color:var(--mb-text);font-weight:500}
.mb-editor>header small{font-size:9px;display:block;color:var(--mb-muted);margin-top:3px}
.mb-editor-toolbar{display:flex;align-items:center;gap:6px;padding:14px 20px}
.mb-editor-toolbar>.mb-segment{margin-right:auto}
.mb-editor>h2{font-size:14px;line-height:1.8;font-weight:500;padding:7px 22px 16px;border-bottom:1px solid var(--mb-line);overflow-wrap:anywhere}
.mb-editor>textarea{flex:1;min-height:0;width:100%;background:transparent;border:0;border-radius:0;padding:20px 22px;line-height:2;font-size:12px;box-shadow:none!important}
.mb-editor>footer{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-top:1px solid var(--mb-line);gap:10px}
.mb-editor>footer>span{font-size:9px;color:var(--mb-muted)}
.mb-editor>footer>.mb-primary-btn{font-size:10px;min-height:32px}
.mb-editor-preview{overflow:auto;padding:20px 22px;flex:1}
.mb-editor-preview .mb-markdown{font-size:12px}
.with-editor .mb-welcome{width:calc(100% - 40px)}
.with-editor .mb-messages,.with-editor .mb-bottom-composer{width:calc(100% - 45px)}
.with-editor .mb-starter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.with-editor .mb-welcome>h1{font-size:32px}
.with-editor .mb-toolbar-divider{display:none}
.with-editor .mb-composer-left{gap:1px}
.with-editor .mb-composer-foot>span:last-child{display:none}
/* Feedback */
.mb-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:140;display:flex;align-items:center;gap:9px;width:max-content;max-width:min(600px,calc(100vw - 32px));padding:12px 17px;border:1px solid #8885;border-radius:11px;background:var(--mb-panel);color:var(--mb-sub);box-shadow:var(--mb-shadow);font-size:11px;line-height:1.7;animation:mb-fade .16s ease;pointer-events:none}
.mb-toast>svg{color:var(--mb-accent)}
.mb-drop-overlay{position:fixed;inset:14px;z-index:150;display:flex;align-items:center;justify-content:center;background:#222e;border:2px dashed var(--mb-accent);border-radius:22px;color:#eee;backdrop-filter:blur(6px)}
.mb-drop-overlay>div{pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:16px}
.mb-drop-overlay h2{font-size:26px;font-weight:500}
.mb-drop-overlay p{font-size:12px;color:#bbb}
@keyframes mb-rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes mb-fade{from{opacity:0}to{opacity:1}}
@keyframes mb-slide{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes mb-pulse{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
@media(min-width:1500px){.mb-sidebar{width:272px;min-width:272px}.mb-welcome{width:820px}.mb-welcome>h1{font-size:45px}.mb-composer>textarea,.is-home .mb-composer>textarea{font-size:16px}.mb-starter-card>strong{font-size:12px}.mb-starter-card>p{font-size:10px}.mb-editor{width:420px}}

async function directChat(options){

  if(!key)return jsonResponse({error:`当前模型由 ${models_1.PROVIDERS[provider].label} 提供，请先填写对应的 API Key。`,code:'NOT_CONFIGURED'},400);

    controller.enqueue(eventBytes({type:'status',id:'connected',label:`已连接 ${host}`}));

    if(wantSearch&&provider!=='zhipu'){

        const found=await runSearch(body.searchQuery||body.lastUserText||'',searchKey,cfg.searchEngine,options.signal);

        controller.enqueue(eventBytes({type:'status',id:'search-done',label:`检索完成，命中 ${sources.length||'若干'} 条来源`}));

       v4.2 的 43 个场景一个都没生效，就是因为写作设置从来没有进入请求。 */
